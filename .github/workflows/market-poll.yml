name: Poll MCX market data

on:
  schedule:
    # 09:00–09:45 IST (UTC is used by GitHub Actions cron).
    - cron: '30,45 3 * * 1-5'
    # 09:30–23:45 IST, Monday–Friday, at 15-minute intervals.
    - cron: '*/15 4-17 * * 1-5'
  workflow_dispatch:

permissions: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request one protected market-data update
        env:
          AURA_POLL_URL: ${{ secrets.AURA_POLL_URL }}
          POLL_SECRET: ${{ secrets.POLL_SECRET }}
        run: |
          if [ -z "$AURA_POLL_URL" ]; then
            echo "::error title=Missing AURA_POLL_URL::Add the GitHub Actions secret with https://aura.lightninglogics.me/api/poll"
            exit 1
          fi
          if [ -z "$POLL_SECRET" ]; then
            echo "::error title=Missing POLL_SECRET::Add the GitHub Actions secret and make it exactly match Vercel's POLL_SECRET."
            exit 1
          fi
          curl --fail --silent --show-error --retry 2 --max-time 55 \
            -H "Authorization: Bearer $POLL_SECRET" \
            "$AURA_POLL_URL"
